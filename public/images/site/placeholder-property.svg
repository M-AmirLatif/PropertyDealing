<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" fill="#f6f2e9" />
  
  <!-- Subtle Drafting Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e7dfd1" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Outer Survey Border -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#cfc3af" stroke-width="1.5" stroke-dasharray="6 4" />
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#bfae98" stroke-width="1" />

  <!-- Corner Survey Crosshairs -->
  <g stroke="#917c65" stroke-width="1.2">
    <path d="M 24 16 L 24 32 M 16 24 L 32 24" />
    <path d="M 776 16 L 776 32 M 768 24 L 784 24" />
    <path d="M 24 568 L 24 584 M 16 576 L 32 576" />
    <path d="M 776 568 L 776 584 M 768 576 L 784 576" />
  </g>

  <!-- Architectural Building Blueprint Illustration -->
  <g transform="translate(400, 260)" stroke="#685744" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Base Platform -->
    <path d="M -140 100 L 0 160 L 140 100 L 0 40 Z" fill="#eee7db" stroke="#8c7860" />
    <path d="M -140 100 L -140 115 L 0 175 L 0 160 Z" fill="#ded4c3" stroke="#8c7860" />
    <path d="M 0 160 L 0 175 L 140 115 L 140 100 Z" fill="#cdbfab" stroke="#8c7860" />

    <!-- Left Building Volume -->
    <path d="M -110 50 L -110 -60 L -20 -15 L -20 95 Z" fill="#fcf9f2" />
    <path d="M -20 -15 L 100 -65 L 100 45 L -20 95 Z" fill="#eae1d1" />
    <path d="M -110 -60 L 10 -110 L 100 -65 L -20 -15 Z" fill="#ffffff" />

    <!-- Second Floor Terrace Projection -->
    <path d="M 10 -110 L -40 -85 L -40 -40 L 10 -65 Z" fill="#ded5c4" />
    <path d="M -40 -40 L 40 -80 L 10 -65 Z" fill="#ede5d8" />

    <!-- Fenestration Lines / Architectural Glazing -->
    <path d="M -90 10 L -40 35 M -90 -20 L -40 5" stroke="#b59a7a" stroke-width="1.5" />
    <path d="M 10 55 L 75 15 M 10 20 L 75 -20" stroke="#b59a7a" stroke-width="1.5" />
    <path d="M -80 70 L -40 90 L -40 45 L -80 25 Z" fill="#cfc1ad" stroke="#685744" stroke-width="1.5" />
  </g>

  <!-- Survey Text & Badging -->
  <g text-anchor="middle">
    <!-- Top Registry Code -->
    <text x="400" y="70" font-family="'DM Mono', monospace" font-size="12" letter-spacing="3" fill="#8c7860" font-weight="500">
      THE PLOT INDEX · KASUR SURVEY REGISTER
    </text>

    <!-- Main Title -->
    <text x="400" y="470" font-family="'Fraunces', serif" font-size="22" fill="#24211b" font-weight="600" letter-spacing="0.5">
      Architectural Listing Pending Photography
    </text>

    <!-- Subtitle / Notice -->
    <text x="400" y="502" font-family="'Hanken Grotesk', sans-serif" font-size="14" fill="#756b5d">
      Architectural property specifications recorded on the dealer register. Field photography will be updated.
    </text>

    <text x="400" y="528" font-family="'DM Mono', monospace" font-size="11" letter-spacing="1.5" fill="#a08b73">
      [ SIMULATED DEMO ASSET · PLACEHOLDER ]
    </text>
  </g>
</svg>
